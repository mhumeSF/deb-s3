---
name: CI

# yamllint disable rule:truthy
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Test
        run: go test ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Build
        run: go build ./...

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up build tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Build release artifacts
        run: VERSION=0.0.0-ci mise run build:deb
      - name: Verify checksums
        run: cd dist && sha256sum --check checksums.txt
      - name: Inspect Debian packages
        run: |
          dpkg-deb --info dist/deb-s3_0.0.0-ci_amd64.deb
          dpkg-deb --info dist/deb-s3_0.0.0-ci_arm64.deb
      - name: Install amd64 package
        run: |
          sudo apt-get install ./dist/deb-s3_0.0.0-ci_amd64.deb
          test "$(deb-s3 --version)" = "deb-s3 version 0.0.0-ci"
